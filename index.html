<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>EplinBot — AI Asisten Modern</title>

  <!-- Fonts & Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..900&family=Poppins:wght@500;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body class="bg-night">
  <!-- Starry bg layers -->
  <canvas id="starsCanvas"></canvas>
  <div class="shooting-stars" aria-hidden="true"></div>

  <!-- Floating Chat Toggler -->
  <button id="chatbot-toggler" aria-label="Buka/Tutup EplinBot" title="Buka EplinBot">
    <span class="material-symbols-outlined">chat</span>
    <span class="material-symbols-outlined">close</span>
  </button>

  <!-- Chatbot Panel -->
  <div class="chatbot-popup" role="dialog" aria-label="EplinBot">
    <!-- Header -->
    <div class="chat-header">
      <div class="header-info">
        <svg class="chatbot-logo" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 1024 1024" aria-hidden="true">
          <path d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.5-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z"></path>
        </svg>
        <div class="brand-wrap">
          <h2 class="logo-text">EplinBot</h2>
          <span class="sub">AI asisten setia Eplin</span>
        </div>
      </div>

      <div class="header-actions">
        <button id="theme-toggle" class="icon-btn" aria-label="Toggle tema">
          <span class="material-symbols-outlined">dark_mode</span>
        </button>
        <button id="close-chatbot" class="icon-btn material-symbols-outlined" aria-label="Tutup">keyboard_arrow_down</button>
      </div>
    </div>

    <!-- Body -->
    <div class="chat-body" id="chat-body">
      <div class="message bot-message">
        <svg class="bot-avatar" xmlns="http://www.w3.org/2000/svg" width="50" height="50" viewBox="0 0 1024 1024" aria-hidden="true">
          <path d="M738.3 287.6H285.7c-59 0-106.8 47.8-106.8 106.8v303.1c0 59 47.8 106.8 106.8 106.8h81.5v111.1c0 .7.8 1.1 1.4.7l166.9-110.6 41.8-.8h117.4l43.6-.4c59 0 106.8-47.8 106.8-106.8V394.5c0-59-47.8-106.9-106.8-106.9zM351.7 448.2c0-29.5 23.9-53.5 53.5-53.5s53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5-53.5-23.9-53.5-53.5zm157.9 267.1c-67.8 0-123.8-47.5-132.3-109h264.6c-8.6 61.5-64.5 109-132.3 109zm110-213.7c-29.5 0-53.5-23.9-53.5-53.5s23.9-53.5 53.5-53.5 53.5 23.9 53.5 53.5-23.9 53.5-53.5 53.5zM867.2 644.5V453.1h26.5c19.4 0 35.1 15.7 35.1 35.1v121.1c0 19.4-15.7 35.1-35.1 35.1h-26.5zM95.2 609.4V488.2c0-19.4 15.7-35.1 35.1-35.1h26.5v191.3h-26.5c-19.4 0-35.1-15.7-35.1-35.1zM561.5 149.6c0 23.4-15.6 43.3-36.9 49.7v44.9h-30v-44.9c-21.4-6.5-36.9-26.3-36.9-49.7 0-28.6 23.3-51.9 51.9-51.9s51.9 23.3 51.9 51.9z"></path>
        </svg>
        <div class="message-text">
          Halo Eplin! Aku EplinBot 🤖✨<br/>
          Tulis pertanyaanmu atau curhat di sini. Mau gambar? Cukup bilang <b>"buatkan gambar ..."</b>.
        </div>
      </div>
    </div>

    <!-- Footer -->
    <div class="chat-footer">
      <form action="#" class="chat-form" autocomplete="off">
        <textarea placeholder="Ketik pesan... (Shift+Enter untuk baris baru)" class="message-input" required></textarea>

        <div class="chat-controls">
          <button type="button" id="emoji-picker" class="material-symbols-outlined" title="Emoji">sentiment_satisfied</button>

          <div class="file-upload-wrapper" title="Lampirkan gambar">
            <input type="file" accept="image/*" id="file-input" hidden />
            <img alt="preview lampiran" />
            <button type="button" id="file-upload" class="material-symbols-outlined">attach_file</button>
            <button type="button" id="file-cancel" class="material-symbols-outlined" title="Hapus lampiran">close</button>
          </div>

          <button type="submit" id="send-message" class="material-symbols-outlined" title="Kirim">arrow_upward</button>
        </div>
      </form>

      <!-- Dropzone hint -->
      <div class="drop-hint" aria-hidden="true">
        <span class="material-symbols-outlined">file_upload</span>
        Tarik & lepas gambar di sini
      </div>
    </div>
  </div>

  <!-- Emoji Mart -->
  <script src="https://cdn.jsdelivr.net/npm/emoji-mart@latest/dist/browser.js"></script>
  <!-- App Script -->
  <script src="script.js?v=3.5"></script>
</body>
</html>
